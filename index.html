<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lottus Designers | Luxury Event Planning & Design Medellín</title>
    <meta name="description" content="Premium luxury event planning and design studio in Medellín, Colombia. Weddings, custom floral installations and unforgettable celebrations." />
    <meta name="theme-color" content="#1E1E1E" />

    <!-- Hero image is the LCP element: start fetching it before the JS bundle runs -->
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%images/hero-mobile.webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" imagesrcset="%BASE_URL%images/hero-960.webp 960w, %BASE_URL%images/hero-1376.webp 1376w" imagesizes="100vw" media="(min-width: 768px)" fetchpriority="high" />

    <!-- Fonts load without blocking first paint (display=swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
